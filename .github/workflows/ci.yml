name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check (no install step — stdlib only, on purpose)
        run: python -m compileall -q scripts tests
      - name: Core must stay stdlib-only
        run: python tests/check_stdlib_only.py
      - name: Regression — synthetic drafts, end to end
        run: bash tests/run_regression.sh
